name: Reusable Build

# Callable by other workflows via `uses:` at the job level.
on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Package
        run: |
          mkdir -p dist
          tar -czf dist/app-${{ inputs.python-version }}.tgz app
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ inputs.python-version }}
          path: dist/app-${{ inputs.python-version }}.tgz
