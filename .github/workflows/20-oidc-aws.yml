name: 20 · OIDC → AWS (no long-lived keys)

# Federates a hosted runner to an IAM role via OIDC.
# REQUIRES a one-time AWS setup (see the lecture's OIDC section):
#   1. Create an OIDC provider for token.actions.githubusercontent.com in AWS.
#   2. Create an IAM role trusting that provider, scoped to this repo.
#   3. Set repo variable AWS_ROLE_ARN to the role ARN.
on:
  workflow_dispatch:

permissions:
  id-token: write       # required for OIDC
  contents: read

jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Verify
        run: aws sts get-caller-identity
