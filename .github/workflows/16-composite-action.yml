name: 16 · Composite Action

# Uses the local composite action at .github/actions/setup-app/
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/actions/setup-app/**"
      - ".github/workflows/16-composite-action.yml"

jobs:
  use-composite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up the app via the composite action
        uses: ./.github/actions/setup-app
        with:
          python-version: "3.12"
      - run: pytest -q
