name: 10 · Secrets & Masking

# Requires a repository secret named DEMO_SECRET.
# Teaches the correct way to consume a secret AND the masking caveat — without
# actually emitting the secret (transformed or otherwise).
on:
  workflow_dispatch:

jobs:
  secret-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Inject the secret via env (correct pattern)
        env:
          TOKEN: ${{ secrets.DEMO_SECRET }}
        run: |
          # Print only metadata about the secret, never the value or any
          # reversible transformation of it.
          echo "secret length = ${#TOKEN}"
          echo "secret sha256 (first 12 hex) = $(printf '%s' "$TOKEN" | sha256sum | cut -c1-12)"

      - name: Masking caveat — explanation only, no leak
        run: |
          cat <<'EOF'
          GitHub masks any occurrence of the EXACT secret value in this job's logs.
          Caveat: masking matches the verbatim string only. Any transformation —
          base64-encoding, substring slicing, concatenation, JSON-encoding — produces
          a string GitHub has not registered as sensitive, so it prints in clear.
          Reversible transforms still leak the secret. Therefore:

            * NEVER echo a secret, even encoded.
            * Pass secrets only through env: or with: into trusted tools.
            * Audit third-party actions before granting them secret access.
          EOF
