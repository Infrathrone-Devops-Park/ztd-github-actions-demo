name: 19 · Self-hosted Runner

# Requires a runner registered with labels `self-hosted, linux, ztd-lab`.

on:
  workflow_dispatch:

jobs:
  on-self-hosted:
    runs-on: [self-hosted, linux, ztd-lab]
    steps:
      - name: Show host
        run: |
          echo "Runner: $(hostname)"
          echo "User:   $(id -un)"
          uname -a
          echo "Filesystem state persists between jobs on this runner unless you clean it up."
